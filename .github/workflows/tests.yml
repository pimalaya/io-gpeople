name: Tests

on:
  push:
  workflow_dispatch:

jobs:
  tests:
    uses: pimalaya/nix/.github/workflows/tests.yml@master
    secrets: inherit

  google-tests:
    # Only in this repository: a fork holds no secret, and the job would fail on
    # every contributor's push for want of one.
    if: github.repository == 'pimalaya/io-gpeople'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v17
        with:
          name: soywod
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community
      - uses: Swatinem/rust-cache@v2
      - name: Run the live tests
        env:
          RUST_LOG: trace
          GPEOPLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GPEOPLE_SERVICE_ACCOUNT_KEY }}
        run: nix develop -c cargo test --features rustls-ring,vcard --test people -- --ignored
